spring:
  application:
    name: pokegateway
  profiles:
    active: dev

---
spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: chat
              uri: ${POKEMON_CHAT_URL}
              predicates:
                - Path=/chat/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Origin
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

            - id: pokemon
              uri: ${POKEMON_SERVICE_URL}
              predicates:
                - Path=/pokemon/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Origin
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

  graphql:
    websocket:
      path: /graphql

  config:
    activate:
      on-profile: dev

  auth0:
    domain: dev-hndn80m8v8iqy45n.us.auth0.com
    client-id: ${OAUTH0_CLIENT_ID}
    client-secret: ${OAUTH0_CLIENT_SECRET}
    audience: "http://poketeamsauth"
    redirect-uri: "http://localhost:8080/auth/callback"
    frontend-success-redirect: "http://localhost:5173"

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${GATEWAY_DB_NAME}
    username: ${POSTGRE_USER}
    password: ${POSTGRE_PASSWORD}
    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
    flyway:
      enabled: true

server:
  address: 0.0.0.0
  port: 8080

logging:
  level:
    root: DEBUG

pokemon.service:
  base-url: ${POKEMON_SERVICE_URL:http://localhost:8081}

chat.service:
  base-url: ${CHAT_SERVICE_URL:http://localhost:8082}
  graphql-url: ${CHAT_SERVICE_GRAPHQL_URL:http://localhost:8082/graphql}
  ws-url: ${CHAT_SERVICE_WS_URL:ws://localhost:8082/graphql}
  subscription-path: ${CHAT_SERVICE_SUBSCRIPTION_PATH:/graphql}

internal-jwt:
  public-key: ${PUBLIC_KEY}
  private-key: ${PRIVATE_KEY}
