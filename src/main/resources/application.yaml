spring:
  application:
    name: pokegateway
  profiles:
    active: dev

  h2:
    console:
      enabled: true
      path: /h2-console
---
spring:
  config:
    activate:
      on-profile: dev

  auth0:
    domain: dev-hndn80m8v8iqy45n.us.auth0.com
    client-id: ${OAUTH0_CLIENT_ID}
    client-secret: ${OAUTH0_CLIENT_SECRET}
    audience: "http://poketeamsauth"
    redirect-uri: "http://localhost:8080/auth/callback"
    frontend-success-redirect: "http://localhost:5173"

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

    properties:
      hibernate:
        format_SQL: true

server:
  address: 0.0.0.0
  port: 8080

logging:
  level:
    root: DEBUG

pokemon.service:
  base-url: ${POKEMON_SERVICE_URL:http://localhost:8081}

