spring:
  application:
    name: pokegateway
  profiles:
    active: dev

  h2:
    console:
      enabled: true
      path: /h2-console
---
spring:
  security:
    oauth2:
      client:
        registration:
          auth0:
            domain: ${OAUTH_DOMAIN}
            client-id: ${OAUTH0_CLIENT_ID}
            client-secret: ${OAUTH0_CLIENT_SECRET}
            audience: "http://poketeamsauth"
            redirect-uri: ${REDIRECT_URI}
            scope: openid, profile, email

  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

    properties:
      hibernate:
        format_SQL: true

server:
  address: 0.0.0.0
  port: 8080

auth0:
  audience: "http://poketeamsauth"

logging:
  level:
    root: DEBUG

pokemon.service:
  base-url: ${POKEMON_SERVICE_URL:http://localhost:8081}

